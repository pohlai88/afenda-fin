# Local PostgreSQL 18 for development (SEL-05 / STACK_ADOPTION Database block).
# Digest-pinned. Not part of `pnpm gate` — use `pnpm db:up` / `pnpm db:down`.
# Dual-major PostgreSQL 17 service is added in Phase 3C commit 2.

services:
  postgres18:
    image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    container_name: afenda-postgres18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: afenda
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afenda"]
      interval: 5s
      timeout: 5s
      retries: 10
