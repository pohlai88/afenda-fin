name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}

      - name: Assert exact Node version
        run: |
          actual="$(node --version)"
          expected="v$(cat .node-version)"
          if [ "$actual" != "$expected" ]; then
            echo "Node version mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Enable corepack (pins pnpm from package.json packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run governance gate
        run: pnpm gate

      - name: Run red harness
        run: pnpm red
